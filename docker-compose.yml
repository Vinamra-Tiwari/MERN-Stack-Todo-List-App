version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mern_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: mern_backend
    ports:
      - '4000:4000'
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/todos

  client:
    build: ./client
    container_name: mern_client
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  mongo_data:
